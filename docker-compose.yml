services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://localhost:11434
      OLLAMA_MODEL: llama3.1
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MODEL: llama3.1
    command: ["serve"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      i=0; while [ $i -lt 5 ]; do
        ollama pull ${OLLAMA_MODEL} && exit 0;
        i=$((i+1)); sleep 3;
      done; exit 1
    restart: on-failure

volumes:
  ollama_data:
